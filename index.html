<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Java Edition Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* authentic HUD crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: difference;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
        }
        #crosshair::before {
            top: 7px;
            left: 0;
            width: 16px;
            height: 2px;
        }
        #crosshair::after {
            top: 0;
            left: 7px;
            width: 2px;
            height: 16px;
        }
        /* Java Hotbar */
        #hotbar-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid #3c3c3c;
            border-radius: 2px;
            padding: 2px;
            z-index: 10;
            box-shadow: inset 0 0 10px #000;
        }
        .hotbar-slot {
            width: 44px;
            height: 44px;
            margin: 1px;
            background: #8b8b8b;
            border: 3px inset #373737;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .hotbar-slot.selected {
            border: 3px solid #ffffff;
            background: #a0a0a0;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }
        .hotbar-slot canvas {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }
        .slot-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #fff;
            text-shadow: 1px 1px #000;
            font-weight: bold;
        }
        /* F3 Debug Screen */
        #debug-screen {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ffffff;
            text-shadow: 2px 2px 0px #000;
            font-size: 14px;
            z-index: 15;
            line-height: 1.4;
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.3);
            padding: 8px;
        }
        /* Title Screen Overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            cursor: pointer;
        }
        #title {
            font-size: 56px;
            font-weight: bold;
            color: #dddddd;
            text-shadow: 4px 4px 0px #3f3f3f, 6px 6px 0px #000000;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        #subtitle {
            font-size: 18px;
            color: #ffff55;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 30px;
            transform: rotate(-5deg);
        }
        .btn-java {
            width: 250px;
            padding: 12px 0;
            background: #737373;
            border: 2px solid #000;
            box-shadow: inset 2px 2px 0px #a8a8a8, inset -2px -2px 0px #3b3b3b;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
        }
        .btn-java:hover {
            background: #6c8a43;
            box-shadow: inset 2px 2px 0px #9ec765, inset -2px -2px 0px #32441c;
        }
        #controls-info {
            margin-top: 30px;
            text-align: center;
            color: #aaaaaa;
            font-size: 12px;
            line-height: 1.6;
            text-shadow: 1px 1px 0px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="debug-screen"></div>

    <div id="hotbar-container">
        <div class="hotbar-slot selected" id="slot-1"><span class="slot-number">1</span></div>
        <div class="hotbar-slot" id="slot-2"><span class="slot-number">2</span></div>
        <div class="hotbar-slot" id="slot-3"><span class="slot-number">3</span></div>
        <div class="hotbar-slot" id="slot-4"><span class="slot-number">4</span></div>
        <div class="hotbar-slot" id="slot-5"><span class="slot-number">5</span></div>
        <div class="hotbar-slot" id="slot-6"><span class="slot-number">6</span></div>
    </div>

    <div id="overlay">
        <div id="title">MINECRAFT</div>
        <div id="subtitle">Java Edition Web 26.2</div>
        <button class="btn-java">Singleplayer</button>
        <div id="controls-info">
            WASD — Walk | Control — Sprint | Space — Jump<br>
            Left Click — Mine | Right Click — Place<br>
            1-6 or Scroll Wheel — Hotbar | F3 — Debug Screen
        </div>
    </div>

    <script>
        // --- 1. Authentic Texture Generator (Multi-Side Blocks) ---
        function createPixelCanvas(baseHex, noiseRange = 0.1, pixels = 16) {
            const canvas = document.createElement('canvas');
            canvas.width = pixels;
            canvas.height = pixels;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, pixels, pixels);
            
            const imgData = ctx.getImageData(0, 0, pixels, pixels);
            for (let i = 0; i < imgData.data.length; i += 4) {
                const noise = (Math.random() - 0.5) * noiseRange * 255;
                imgData.data[i] = Math.min(255, Math.max(0, imgData.data[i] + noise));
                imgData.data[i+1] = Math.min(255, Math.max(0, imgData.data[i+1] + noise));
                imgData.data[i+2] = Math.min(255, Math.max(0, imgData.data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        function createGrassSideCanvas() {
            const canvas = createPixelCanvas('#835432', 0.08); // dirt
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#5c8e32';
            // Draw grass dripping down
            for(let x=0; x<16; x++){
                const depth = 3 + Math.floor(Math.sin(x*1.5)*2);
                ctx.fillRect(x, 0, 1, depth);
            }
            return canvas;
        }

        function canvasToTexture(canvas) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        // Texture library
        const texGrassTop  = canvasToTexture(createPixelCanvas('#5c8e32', 0.06));
        const texGrassSide = canvasToTexture(createGrassSideCanvas());
        const texDirt      = canvasToTexture(createPixelCanvas('#835432', 0.08));
        const texStone     = canvasToTexture(createPixelCanvas('#737373', 0.06));
        const texWoodSide  = canvasToTexture(createPixelCanvas('#674a2e', 0.05));
        const texWoodTop   = canvasToTexture(createPixelCanvas('#9e7a4f', 0.05));
        const texLeaves    = canvasToTexture(createPixelCanvas('#386b24', 0.12));
        const texBedrock   = canvasToTexture(createPixelCanvas('#2b2b2b', 0.25));

        // Create Materials for each Block ID [px, nx, py, ny, pz, nz]
        function makeCubeMaterials(top, side, bottom) {
            return [
                new THREE.MeshLambertMaterial({ map: side }),
                new THREE.MeshLambertMaterial({ map: side }),
                new THREE.MeshLambertMaterial({ map: top }),
                new THREE.MeshLambertMaterial({ map: bottom || side }),
                new THREE.MeshLambertMaterial({ map: side }),
                new THREE.MeshLambertMaterial({ map: side })
            ];
        }

        const BLOCK_MATS = {
            1: makeCubeMaterials(texGrassTop, texGrassSide, texDirt),
            2: makeCubeMaterials(texDirt, texDirt, texDirt),
            3: makeCubeMaterials(texStone, texStone, texStone),
            4: makeCubeMaterials(texWoodTop, texWoodSide, texWoodTop),
            5: [
                new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 }),
                new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 }),
                new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 }),
                new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 }),
                new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 }),
                new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 })
            ],
            6: makeCubeMaterials(texBedrock, texBedrock, texBedrock)
        };

        // Render Hotbar Icons
        const slotCanvases = [texGrassTop.image, texDirt.image, texStone.image, texWoodSide.image, texLeaves.image, texBedrock.image];
        for (let i = 1; i <= 6; i++) {
            const slot = document.getElementById(`slot-${i}`);
            slot.appendChild(slotCanvases[i-1]);
        }

        // --- 2. Scene, Skybox & Lighting ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff); // Java sky color
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.012);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Java Directional Shading Simulation
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.55);
        sunLight.position.set(50, 100, 30);
        scene.add(sunLight);

        // Minecraft Clouds
        const cloudGeo = new THREE.PlaneGeometry(1000, 1000);
        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
        const clouds = new THREE.Mesh(cloudGeo, cloudMat);
        clouds.position.y = 120;
        clouds.rotation.x = Math.PI / 2;
        scene.add(clouds);

        // --- 3. World Generation ---
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = new Map();

        function getBlockKey(x, y, z) {
            return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
        }

        function addBlock(x, y, z, id) {
            const bx = Math.floor(x), by = Math.floor(y), bz = Math.floor(z);
            const key = getBlockKey(bx, by, bz);
            if (blocks.has(key)) return;

            const mesh = new THREE.Mesh(blockGeo, BLOCK_MATS[id]);
            mesh.position.set(bx + 0.5, by + 0.5, bz + 0.5);
            mesh.userData = { key, id, pos: [bx, by, bz] };
            scene.add(mesh);
            blocks.set(key, mesh);
            return mesh;
        }

        function removeBlock(mesh) {
            if (!mesh) return;
            scene.remove(mesh);
            blocks.delete(mesh.userData.key);
        }

        // Generate Chunk with Trees
        const CHUNK_SIZE = 36;
        for (let x = -CHUNK_SIZE/2; x < CHUNK_SIZE/2; x++) {
            for (let z = -CHUNK_SIZE/2; z < CHUNK_SIZE/2; z++) {
                // Natural Terrain Height
                const h = Math.floor(Math.sin(x * 0.12) * 3 + Math.cos(z * 0.12) * 3) + 4;
                
                addBlock(x, 0, z, 6); // Bedrock bottom
                for (let y = 1; y < h - 2; y++) addBlock(x, y, z, 3); // Stone
                for (let y = h - 2; y < h; y++) addBlock(x, y, z, 2); // Dirt
                addBlock(x, h, z, 1); // Grass

                // Spawn Trees randomly
                if (x % 7 === 0 && z % 7 === 0 && Math.random() > 0.3 && Math.abs(x) > 3 && Math.abs(z) > 3) {
                    const treeH = 4 + Math.floor(Math.random() * 2);
                    for (let ty = 1; ty <= treeH; ty++) addBlock(x, h + ty, z, 4); // Trunk
                    // Leaves
                    for (let lx = -2; lx <= 2; lx++) {
                        for (let lz = -2; lz <= 2; lz++) {
                            for (let ly = treeH - 1; ly <= treeH + 1; ly++) {
                                if (Math.abs(lx) + Math.abs(lz) < 3) {
                                    addBlock(x + lx, h + ly, z + lz, 5);
                                }
                            }
                        }
                    }
                }
            }
        }

        // --- 4. First-Person Hand & Wireframe Selection ---
        const handGroup = new THREE.Group();
        const handGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
        const handMat = new THREE.MeshLambertMaterial({ color: 0xc89678 }); // Steve Skin color
        const handMesh = new THREE.Mesh(handGeo, handMat);
        handMesh.position.set(0.4, -0.4, -0.6);
        handMesh.rotation.set(0.2, -0.3, 0);
        handGroup.add(handMesh);
        camera.add(handGroup);
        scene.add(camera);

        // Highlight Wireframe Box
        const wireGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01);
        const wireMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
        const wireBox = new THREE.LineSegments(new THREE.EdgesGeometry(wireGeo), wireMat);
        wireBox.visible = false;
        scene.add(wireBox);

        // --- 5. Player Physics & Controls ---
        const player = {
            pos: new THREE.Vector3(0, 12, 0),
            vel: new THREE.Vector3(0, 0, 0),
            height: 1.62,
            radius: 0.3,
            onGround: false,
            sprinting: false
        };

        let selectedSlot = 1;
        const keys = {};
        let isLocked = false;

        document.getElementById('overlay').addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === renderer.domElement);
            document.getElementById('overlay').style.display = isLocked ? 'none' : 'flex';
        });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.0022;
            pitch -= e.movementY * 0.0022;
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));

            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        });

        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.key >= '1' && e.key <= '6') selectSlot(parseInt(e.key));
            if (e.code === 'F3') {
                e.preventDefault();
                const dbg = document.getElementById('debug-screen');
                dbg.style.display = dbg.style.display === 'block' ? 'none' : 'block';
            }
        });
        document.addEventListener('keyup', e => { keys[e.code] = false; });

        document.addEventListener('wheel', e => {
            if (!isLocked) return;
            let next = selectedSlot + (e.deltaY > 0 ? 1 : -1);
            if (next > 6) next = 1;
            if (next < 1) next = 6;
            selectSlot(next);
        });

        function selectSlot(num) {
            selectedSlot = num;
            document.querySelectorAll('.hotbar-slot').forEach((s, idx) => {
                s.classList.toggle('selected', idx + 1 === num);
            });
        }

        // Raycasting Mining & Building
        const raycaster = new THREE.Raycaster();
        raycaster.far = 5.5;

        let swingAnim = 0;
        document.addEventListener('mousedown', (e) => {
            if (!isLocked) return;
            swingAnim = 1; // Trigger arm swing

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(Array.from(blocks.values()));

            if (hits.length > 0) {
                const hit = hits[0];
                if (e.button === 0) {
                    // Left Click: Mine Block (Bedrock protected)
                    if (hit.object.userData.id !== 6) {
                        removeBlock(hit.object);
                    }
                } else if (e.button === 2) {
                    // Right Click: Place Block
                    const norm = hit.face.normal;
                    const [bx, by, bz] = hit.object.userData.pos;
                    const nx = bx + norm.x, ny = by + norm.y, nz = bz + norm.z;

                    // Player bounding box collision check
                    const px = Math.floor(player.pos.x);
                    const py1 = Math.floor(player.pos.y);
                    const py2 = Math.floor(player.pos.y - 1);
                    const pz = Math.floor(player.pos.z);

                    if (!(nx === px && pz === pz && (ny === py1 || ny === py2))) {
                        addBlock(nx, ny, nz, selectedSlot);
                    }
                }
            }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());

        // AABB Collision Detection
        function hasBlockAt(x, y, z) {
            return blocks.has(getBlockKey(x, y, z));
        }

        function collidePlayer(pos) {
            const minX = Math.floor(pos.x - player.radius);
            const maxX = Math.floor(pos.x + player.radius);
            const minY = Math.floor(pos.y - player.height);
            const maxY = Math.floor(pos.y);
            const minZ = Math.floor(pos.z - player.radius);
            const maxZ = Math.floor(pos.z + player.radius);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (hasBlockAt(x, y, z)) return true;
                    }
                }
            }
            return false;
        }

        // --- 6. Game Engine Loop ---
        let clock = new THREE.Clock();
        let frameCount = 0, fps = 60;

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            frameCount++;

            if (isLocked) {
                // Sprinting FOV handling
                player.sprinting = keys['ControlLeft'] || keys['ControlRight'];
                const targetFov = player.sprinting ? 78 : 70;
                camera.fov += (targetFov - camera.fov) * 0.1;
                camera.updateProjectionMatrix();

                // Movement vector
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();

                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0; right.normalize();

                const move = new THREE.Vector3();
                if (keys['KeyW']) move.add(forward);
                if (keys['KeyS']) move.sub(forward);
                if (keys['KeyD']) move.add(right);
                if (keys['KeyA']) move.sub(right);
                move.normalize();

                const speed = player.sprinting ? 7.2 : 4.3;
                player.vel.x = move.x * speed;
                player.vel.z = move.z * speed;

                // Jump & Gravity
                if (keys['Space'] && player.onGround) {
                    player.vel.y = 7.8;
                    player.onGround = false;
                }
                player.vel.y -= 24.0 * dt;

                // Physics Collision (Axis-by-Axis)
                player.pos.x += player.vel.x * dt;
                if (collidePlayer(player.pos)) player.pos.x -= player.vel.x * dt;

                player.pos.z += player.vel.z * dt;
                if (collidePlayer(player.pos)) player.pos.z -= player.vel.z * dt;

                player.pos.y += player.vel.y * dt;
                if (collidePlayer(player.pos)) {
                    if (player.vel.y < 0) player.onGround = true;
                    player.pos.y -= player.vel.y * dt;
                    player.vel.y = 0;
                } else {
                    player.onGround = false;
                }

                // Void reset
                if (player.pos.y < -30) {
                    player.pos.set(0, 15, 0);
                    player.vel.set(0,0,0);
                }

                camera.position.copy(player.pos);

                // Hand Animation (Walking Bobbing + Mining Swing)
                if (swingAnim > 0) {
                    swingAnim -= dt * 6;
                    handMesh.rotation.x = 0.2 - Math.sin(swingAnim * Math.PI) * 0.8;
                } else {
                    const bob = Math.sin(Date.now() * 0.008) * (move.length() > 0 ? 0.04 : 0.01);
                    handMesh.position.y = -0.4 + bob;
                    handMesh.rotation.x = 0.2;
                }

                // Highlight Targeted Block Wireframe
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const targetHits = raycaster.intersectObjects(Array.from(blocks.values()));
                if (targetHits.length > 0) {
                    const pos = targetHits[0].object.userData.pos;
                    wireBox.position.set(pos[0] + 0.5, pos[1] + 0.5, pos[2] + 0.5);
                    wireBox.visible = true;
                } else {
                    wireBox.visible = false;
                }

                // Clouds Movement
                clouds.position.z += dt * 0.8;

                // F3 Debug Info
                if (frameCount % 10 === 0) {
                    fps = Math.round(1 / dt);
                    document.getElementById('debug-screen').innerHTML = `
                        Minecraft 26.2 (Web Edition)<br>
                        ${fps} fps<br><br>
                        XYZ: ${player.pos.x.toFixed(3)} / ${player.pos.y.toFixed(3)} / ${player.pos.z.toFixed(3)}<br>
                        Block: ${Math.floor(player.pos.x)} ${Math.floor(player.pos.y)} ${Math.floor(player.pos.z)}<br>
                        Facing: ${yaw.toFixed(2)} / ${pitch.toFixed(2)}
                    `;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
